[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "market-digest"
version = "0.1.0"
description = "Codzienny raport rynkowy (Markdown, PL) dla globalnych rynków rozwiniętych"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "httpx>=0.27",
    "feedparser>=6.0",
    "yfinance>=0.2.40",
    "pandas>=2.0",
    "exchange-calendars>=4.5",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
market-digest = "market_digest.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/market_digest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: wymaga dostępu do internetu (domyślnie pomijane)"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# Polskie teksty zawierają półpauzy i inne znaki typograficzne; typer wymaga wywołań w defaultach.
ignore = ["RUF001", "RUF002", "RUF003", "B008", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["market_digest", "tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["yfinance.*", "feedparser.*", "exchange_calendars.*", "pandas.*"]
ignore_missing_imports = true
