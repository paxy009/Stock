name: Heartbeat

# Niezależny strażnik: jeśli raport nie został doręczony (np. harmonogram pominięty),
# ten job kończy się błędem, a GitHub wysyła powiadomienie o nieudanym workflow.
on:
  schedule:
    - cron: "30 2 * * *"
      timezone: "Europe/Warsaw"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Restore state
        run: |
          mkdir -p market-digest/data
          git fetch --depth=1 origin data
          git show origin/data:market.db > market-digest/data/market.db
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: market-digest/pyproject.toml
      - run: pip install -e .
        working-directory: market-digest
      - name: Check last delivery
        working-directory: market-digest
        run: market-digest heartbeat --max-age-hours 12
